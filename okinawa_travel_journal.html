    // =========================================================================
    // 2. STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
    // =========================================================================
    let appData = loadData();
    let currentTab = 'home';
    let selectedDay = 1; // 1-5 or 'all'
    let selectedMapDay = 2;
    let selectedDiningFilter = 'ALL';
    let selectedPhotoFilter = 'ALL';
    let editMode = false;

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {
        console.error('Failed to load localStorage:', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveData(msg = '已自動儲存至手帳') {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        showToast(msg);
      } catch (e) {
        console.error('Save error:', e);
        showToast('儲存空間已滿，建議減少大型照片或匯出備份');
      }
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toastMsg');
      msgEl.textContent = text;
      toast.classList.remove('translate-x-full', 'opacity-0');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
      }, 2400);
    }

    // =========================================================================
    // 3. NAVIGATION & EDIT MODE
    // =========================================================================
    function switchTab(tab, extraParam = null) {
      currentTab = tab;
      if (tab === 'itinerary' && extraParam !== null) {
        selectedDay = extraParam;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateNavHighlight();
      render();
    }

    function updateNavHighlight() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isTarget = btn.dataset.nav === currentTab;
        btn.className = isTarget
          ? 'nav-btn px-3 py-1.5 rounded-full bg-coffee-800 text-cream-100 font-medium transition'
          : 'nav-btn px-3 py-1.5 rounded-full text-coffee-800 hover:bg-cream-200 transition';
      });
      document.querySelectorAll('.mnav-btn').forEach(btn => {
        const isTarget = btn.dataset.mnav === currentTab;
        btn.className = isTarget
          ? 'mnav-btn flex flex-col items-center py-1 px-2 rounded-xl text-[10px] gap-0.5 bg-cblue-200/80 text-coffee-800 font-semibold'
          : 'mnav-btn flex flex-col items-center py-1 px-2 rounded-xl text-[10px] gap-0.5 text-coffee-600';
      });
    }

    function toggleEditMode() {
      editMode = !editMode;
      const btn = document.getElementById('editModeBtn');
      const label = document.getElementById('editModeLabel');
      const banner = document.getElementById('editBanner');
      if (editMode) {
        btn.classList.add('bg-coffee-800', 'text-cream-100');
        btn.classList.remove('bg-cream-200/70', 'text-coffee-800');
        label.textContent = '編輯中';
        banner.classList.remove('hidden');
      } else {
        btn.classList.remove('bg-coffee-800', 'text-cream-100');
        btn.classList.add('bg-cream-200/70', 'text-coffee-800');
        label.textContent = '編輯模式';
        banner.classList.add('hidden');
      }
      render();
    }

    function toggleMoreMenu() {
      const drawer = document.getElementById('moreDrawer');
      drawer.classList.toggle('hidden');
    }

    // =========================================================================
    // 4. RENDER ROUTER
    // =========================================================================
    function render() {
      const container = document.getElementById('appContainer');
      switch (currentTab) {
        case 'home': container.innerHTML = renderHome(); break;
        case 'itinerary': container.innerHTML = renderItinerary(); break;
        case 'maps': container.innerHTML = renderMaps(); break;
        case 'dining': container.innerHTML = renderDining(); break;
        case 'budget': container.innerHTML = renderBudget(); break;
        case 'photos': container.innerHTML = renderPhotos(); break;

        case 'weather':

    // =========================================================================
    // 9. PAGE 5: BUDGET MANAGER (旅行預算與雙人分帳)
    // =========================================================================
    function renderBudget() {
      const rate = Number(appData.budget.exchangeRate) || 0.215;
      const totalBudget = Number(appData.budget.totalBudgetTWD) || 0;
      const categories = ['機票', '租車', '住宿', 'ETC／高速公路費', '油錢', '餐飲', '購物', '景點門票', '其他支出'];

      let totalSpentTWD = 0;
      let paidByMe = 0;
      let paidByBaby = 0;
      let paidShared = 0;

      const enriched = appData.budget.expenses.map(item => {
        const twd = item.currency === 'JPY' ? Math.round(item.amount * rate) : Math.round(item.amount);
        totalSpentTWD += twd;
        if (item.payer === '我付款') paidByMe += twd;
        else if (item.payer === '寶寶付款') paidByBaby += twd;
        else paidShared += twd;
        return { ...item, twd };
      });

      const remaining = totalBudget - totalSpentTWD;

      return `
        <div class="fade-in space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div class="text-xs tracking-[0.2em] text-coffee-400 font-serif">TRAVEL BUDGET</div>
              <h1 class="text-2xl sm:text-3xl font-bold text-coffee-800">旅行預算與雙人記帳</h1>
            </div>

            <!-- Exchange Rate & Total Budget Settings -->
            <div class="flex flex-wrap items-center gap-2 bg-white px-4 py-2.5 rounded-2xl border border-cream-300 shadow-xs text-xs">
              <label class="flex items-center gap-1.5 text-coffee-700">
                <span>日幣匯率</span>
                <input type="number" step="0.001" value="${rate}" onchange="updateBudgetMeta('exchangeRate', this.value)" class="w-16 px-2 py-1 rounded-lg bg-cream-100 border border-cream-300 font-mono text-coffee-800 focus:outline-none" />
              </label>
              <span class="text-cream-300">|</span>
              <label class="flex items-center gap-1.5 text-coffee-700">
                <span>總預算 NT$</span>
                <input type="number" step="500" value="${totalBudget}" onchange="updateBudgetMeta('totalBudgetTWD', this.value)" class="w-24 px-2 py-1 rounded-lg bg-cream-100 border border-cream-300 font-mono text-coffee-800 focus:outline-none" />
              </label>
            </div>
          </div>

          <!-- Summary Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white rounded-3xl p-5 border border-cream-300 shadow-journal">
              <div class="text-xs text-coffee-600">目前總花費（換算台幣）</div>
              <div class="font-serif text-3xl font-bold text-coffee-800 mt-1">NT$ ${totalSpentTWD.toLocaleString()}</div>
              <div class="text-[11px] text-coffee-400 mt-1">含機票、住宿、租車與現場支出</div>
            </div>

            <div class="bg-white rounded-3xl p-5 border border-cream-300 shadow-journal">
              <div class="text-xs text-coffee-600">預算剩餘差額</div>
              <div class="font-serif text-3xl font-bold mt-1 ${remaining >= 0 ? 'text-cblue-600' : 'text-red-700'}">
                ${remaining >= 0 ? `NT$ ${remaining.toLocaleString()}` : `-NT$ ${Math.abs(remaining).toLocaleString()}`}
              </div>
              <div class="text-[11px] text-coffee-400 mt-1">${remaining >= 0 ? '尚在設定預算內' : '已超出設定總預算'}</div>
            </div>

            <div class="bg-cblue-100/70 rounded-3xl p-5 border border-cblue-400/40">
              <div class="text-xs font-semibold text-coffee-800 mb-2">兩人付款統計（🫶🏻 分帳小幫手）</div>
              <div class="space-y-1 text-xs text-coffee-700">
                <div class="flex justify-between"><span>我付款：</span><strong>NT$ ${paidByMe.toLocaleString()}</strong></div>
                <div class="flex justify-between"><span>寶寶付款：</span><strong>NT$ ${paidByBaby.toLocaleString()}</strong></div>
                ${paidShared > 0 ? `<div class="flex justify-between"><span>共同分攤：</span><strong>NT$ ${paidShared.toLocaleString()}</strong></div>` : ''}
              </div>
            </div>
          </div>

          <!-- Add Expense Form -->
          <form onsubmit="addExpense(event)" class="bg-white rounded-3xl p-5 sm:p-6 border border-cream-300 shadow-journal space-y-4">
            <div class="text-sm font-bold text-coffee-800 flex items-center gap-2">
              <i data-lucide="plus-circle" class="w-4 h-4 text-cblue-600"></i>
              <span>新增一筆旅行支出</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 text-xs">
              <select id="expCat" class="px-3 py-2.5 rounded-xl bg-cream-100 border border-cream-300 text-coffee-800">
                ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
              </select>
              <input id="expTitle" type="text" required placeholder="項目名稱（如：美ら海水族館門票）" class="lg:col-span-2 px-3 py-2.5 rounded-xl bg-cream-100 border border-cream-300 text-coffee-800" />
              <div class="flex gap-1.5">
                <select id="expCurr" class="px-2.5 py-2.5 rounded-xl bg-cream-100 border border-cream-300 text-coffee-800 font-medium">
                  <option value="JPY">JPY ¥</option>
                  <option value="TWD">TWD $</option>
                </select>
                <input id="expAmount" type="number" step="any" required placeholder="金額" class="w-full px-3 py-2.5 rounded-xl bg-cream-100 border border-cream-300 text-coffee-800" />
              </div>
              <select id="expPayer" class="px-3 py-2.5 rounded-xl bg-cream-100 border border-cream-300 text-coffee-800">
                <option value="我付款">我付款</option>
                <option value="寶寶付款">寶寶付款</option>
                <option value="共同分攤">共同分攤</option>
              </select>
              <button type="submit" class="px-4 py-2.5 rounded-xl bg-coffee-800 text-cream-100 font-medium hover:bg-coffee-600 transition">
                加入記帳
              </button>
            </div>
            <input id="expNote" type="text" placeholder="備註（選填，如：刷卡、現場付現、哪一天的餐費）" class="w-full px-3 py-2 rounded-xl bg-cream-100/70 border border-cream-300 text-xs text-coffee-800" />
          </form>

          <!-- Expense List -->
          <div class="bg-white rounded-3xl border border-cream-300 shadow-journal overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-cream-200 flex items-center justify-between">
              <span class="font-bold text-sm text-coffee-800">支出明細紀錄（共 ${enriched.length} 筆）</span>
              <span class="text-xs text-coffee-400">匯率 1 JPY = ${rate} TWD</span>
            </div>
            <div class="divide-y divide-cream-200">
              ${enriched.map(item => `
                <div class="p-4 sm:px-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-cream-100/60 transition">
                  <div class="space-y-1">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="px-2.5 py-0.5 rounded-full bg-cream-200 text-coffee-800 text-[11px] font-medium">${item.category}</span>
                      <span class="px-2.5 py-0.5 rounded-full ${item.payer === '寶寶付款' ? 'bg-cblue-200/80 text-coffee-800' : 'bg-cream-100 border border-cream-300 text-coffee-600'} text-[11px]">${item.payer}</span>
                      <span class="font-bold text-sm text-coffee-800">${item.title}</span>
                    </div>
                    ${item.note ? `<div class="text-xs text-coffee-500 pl-1">${item.note}</div>` : ''}
                  </div>

                  <div class="flex items-center justify-between sm:justify-end gap-4">
                    <div class="text-right">
                      <div class="font-serif font-bold text-base text-coffee-800">NT$ ${item.twd.toLocaleString()}</div>
                      ${item.currency === 'JPY' ? `<div class="text-[11px] text-coffee-500">¥${Number(item.amount).toLocaleString()} JPY</div>` : ''}
                    </div>
                    <div class="flex items-center gap-1.5">
                      <button onclick="openEditExpenseModal('${item.id}')" class="p-1.5 rounded-lg text-coffee-600 hover:bg-cream-200" title="修改">
                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                      </button>
                      <button onclick="deleteExpense('${item.id}')" class="p-1.5 rounded-lg text-red-600 hover:bg-red-50" title="刪除">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. PAGE 7: PACKING & PRE-TRIP CHECKLIST (旅行與行李清單)
    // =========================================================================
    function renderPacking() {
      let totalItems = 0;
      let doneItems = 0;
      appData.packing.forEach(cat => {

    async function fetchLiveWeather() {
      const grid = document.getElementById('liveWeatherGrid');
      if (!grid) return;

      const locations = [
        { name: '那霸市 (Naha)', sub: 'Day 1, 4, 5 住宿與市區', lat: 26.2124, lon: 127.6809 },
        { name: '恩納 / 讀谷村 (Onna)', sub: 'Day 3 琉球村・BANTA CAFE', lat: 26.4981, lon: 127.8529 },
        { name: '名護 / 美麗海・古宇利', sub: 'Day 2 北部自駕重點區域', lat: 26.5915, lon: 127.9773 }
      ];

      function decodeWMO(code) {
        if (code === 0) return '晴朗無雲 ☀️';
        if (code <= 3) return '多雲時晴 ⛅';
        if (code <= 48) return '有霧 / 薄霧 🌫️';
        if (code <= 67) return '陣雨 / 小雨 🌦️';
        if (code <= 82) return '局部陣雨 🌧️';
        return '雷陣雨 ⛈️';
      }

      try {
        const results = await Promise.all(locations.map(async loc => {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,precipitation,weather_code,wind_speed_10m&daily=precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=1`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('Weather API error');
          const data = await res.json();
          return { loc, data };
        }));

        grid.innerHTML = results.map(({ loc, data }) => {
          const cur = data.current;
          const rainProb = data.daily?.precipitation_probability_max?.[0] ?? 0;
          return `
            <div class="bg-white rounded-3xl p-5 border border-cream-300 shadow-journal space-y-3">
              <div class="flex items-start justify-between">
                <div>
                  <h3 class="font-bold text-base text-coffee-800">${loc.name}</h3>
                  <div class="text-[11px] text-coffee-500">${loc.sub}</div>
                </div>
                <span class="px-2.5 py-1 rounded-full bg-cblue-100 text-coffee-800 text-xs font-medium">即時觀測</span>
              </div>
              <div class="flex items-baseline justify-between pt-2">
                <div class="font-serif text-4xl font-bold text-coffee-800">${Math.round(cur.temperature_2m)}°C</div>
                <div class="text-sm font-medium text-coffee-700">${decodeWMO(cur.weather_code)}</div>
              </div>
              <div class="pt-3 border-t border-cream-200 grid grid-cols-2 gap-2 text-xs text-coffee-600">
                <div>降雨機率：<strong>${rainProb}%</strong></div>
                <div>目前風速：<strong>${cur.wind_speed_10m} km/h</strong></div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = `
          <div class="md:col-span-3 bg-white rounded-3xl p-6 border border-cream-300 text-xs text-coffee-600 text-center">
            目前無法連線取得即時氣象 API 資料，請直接點擊下方「日本氣象廳 (JMA)」或「tenki.jp」查看最新官方預報。
          </div>
        `;
      }
    }

          </div>

    function handlePhotoUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById('photoFile');
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          // Compress image to max 900px width so localStorage holds many photos reliably
          const canvas = document.createElement('canvas');
          const maxW = 900;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.78);

          const dayVal = document.getElementById('photoDay').value;
          const dateMap = { 'DAY 1': '2026.11.28', 'DAY 2': '2026.11.29', 'DAY 3': '2026.11.30', 'DAY 4': '2026.12.01', 'DAY 5': '2026.12.02' };

          appData.photos.unshift({
            id: 'p-' + Date.now(),
            day: dayVal,
            caption: document.getElementById('photoCaption').value,
            url: compressedDataUrl,
            date: dateMap[dayVal] || ''
          });
          saveData('照片已收藏至手帳相簿');
          closeModal();
          render();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

            </button>

              <i data-lucide="upload" class="w-4 h-4"></i>
              <span>匯入對方傳來的檔案</span>
              <input type="file" accept=".json" onchange="importJsonFile(event)" class="hidden" />
            </label>
          </div>
          <div class="pt-3 border-t border-cream-200 flex justify-between items-center">
            <span class="text-coffee-400">需要恢復為最初 PDF 版本？</span>
            <button onclick="resetToDefault()" class="text-red-600 underline">重設為預設行程</button>
          </div>
        </div>
      `);

    function exportJsonFile() {
      const dataStr = JSON.stringify(appData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Okinawa_Travel_Journal_2026.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('已下載備份檔案，可直接傳給寶寶！');
    }

    function importJsonFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && parsed.days && parsed.budget) {
            appData = parsed;
            saveData('已成功匯入最新旅行資料！');
            closeModal();
            render();
          } else {
            showToast('檔案格式不正確');
          }
        } catch (err) {
          showToast('無法讀取該檔案');
        }
      };
      reader.readAsText(file);
    }

    function resetToDefault() {
      appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveData('已恢復為原始 PDF 行程資料');
      closeModal();
      render();
    }
